# Run lint, test, wheel, and hygiene checks for each proposed change.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: python_phase
        name: Check Python phase
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "pyproject.toml is absent; skipping Python lint."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        with:
          python-version: "3.10"
      - if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        run: python -m pip install ruff==0.16.1 mypy==2.3.0
      - if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        run: ruff check .
      - if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        run: mypy .

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: python_phase
        name: Check Python phase
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "pyproject.toml is absent; skipping Python tests."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        with:
          python-version: "3.10"
      - name: Install the frozen Rust toolchain
        if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ steps.python_phase.outputs.enabled == 'true' }}
      - if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        # The facade tier drives the native store, so the extension is
        # built for real (maturin develop inside a venv, mirroring the
        # development setup); skipping it would let the suite go green
        # without the package -- the failure mode the release checks
        # exist to prevent.
        run: |
          python -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install \
            pytest==9.1.1 \
            jsonschema==4.26.0 \
            tokenizers==0.22.2 \
            huggingface-hub==0.36.2 \
            platformdirs==4.11.0 \
            maturin==1.14.1 \
            tomli==2.4.0
          maturin develop --release
      - if: ${{ steps.python_phase.outputs.enabled == 'true' }}
        run: |
          . .ci-venv/bin/activate
          pytest

  generated-tables:
    # The registry and the evidence manifests are generated by tooling only.
    # This checks the serialisation, the schema and the root digest; a hand
    # edit fails it. The registry's prebuilt-binding rows bind to the native
    # host's compile-time identity, which only a built extension can report,
    # so the job builds the wheel and installs it first. numpy comes from
    # the GPU module's import chain and is not a core wheel dependency.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Install the frozen Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          python -m pip install maturin==1.14.1 jsonschema==4.26.0
          maturin build --locked --release --out dist
          python -m pip install --disable-pip-version-check "numpy>=1.24" dist/*.whl
      - run: python tools/generate_registry.py --check
      - run: python tools/update_fast_cpu_registry.py --check
      - run: python tools/generate_evidence.py --check --campaign main
      - run: python tools/generate_evidence.py --check --campaign extra
      - run: python tools/verify_carryover.py --check
      - run: python tools/generate_readme_backfill.py --check
      - run: python tools/generate_artifact_manifest.py --check
      - run: python tools/generate_sibling_aliases.py --check
      - run: python tools/generate_pypi_readme.py --check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: rust_phase
        name: Check Rust phase
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "Root Cargo.toml is absent; skipping Rust checks."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        name: Install the frozen Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        run: cargo fmt --check
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        run: cargo clippy -- -D warnings
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # The published toktier crate has features the default build
        # never compiles (serde, and jit -- a certified second build).
        # This step type-checks them. It stays scoped to the crate: a
        # workspace-wide --all-features would pull gigatoken-core's
        # upstream-tests feature, whose vendored inline tests are a
        # known red outside this workflow's scope.
        run: cargo clippy --all-features --all-targets -p toktier -- -D warnings
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        run: cargo test
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # `network` left the default set in 0.2.5, so the step above no
        # longer compiles or runs the acquisition code or its loopback
        # tests -- the clippy step type-checks them but does not run
        # them. This step runs them. The default step keeps covering the
        # feature-off stub, which no earlier configuration compiled.
        run: cargo test -p toktier --features network
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # The smallest supported configuration. It carries no test body
        # of its own -- the suites above need `sqlite` and `serving` --
        # so this guards compilation rather than behaviour, which is
        # what actually breaks when a feature gate is misplaced.
        run: cargo build -p toktier --no-default-features
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # The legal closure reads `cargo metadata --offline --locked` across
        # every target, so the local cache must hold the full dependency
        # set; the build steps above only download what the host build
        # actually compiles.
        run: cargo fetch --locked
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # The judged compiled closure is data the crate ships and the
        # build script reads, and it is a function of the feature set
        # the registry records. Nothing else in CI compared it with the
        # tree, so a default-feature change could leave it describing
        # the previous build. It needs the fetch above for the same
        # reason the two records below do.
        run: python3 tools/generate_judged_closure.py --check
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # The fast CPU pre-tokenizer reads its character classes from ICU
        # property data and the reference engine reads the same classes
        # from Oniguruma. The two have to answer alike about every code
        # point for the id comparison behind certification to mean what
        # it says, and they only do so while the property data is pinned
        # to the Unicode version Oniguruma carries.
        run: python3 tools/check_class_parity.py
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        run: python3 tools/generate_native_legal.py --check
      - if: ${{ steps.rust_phase.outputs.enabled == 'true' }}
        # Same closure, other consumer: the SBOM and license list that the
        # published crate carries in its own data payload. It reads the
        # workspace versions too, so it goes stale in exactly the same
        # way and belongs behind the same fetch.
        run: python3 tools/generate_rust_distribution_metadata.py --check

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: wheel_phase
        name: Check wheel phase
        run: |
          if [ ! -f crates/toktier-py/Cargo.toml ]; then
            echo "crates/toktier-py/Cargo.toml is absent; skipping wheel build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ steps.wheel_phase.outputs.enabled == 'true' }}
        with:
          python-version: "3.10"
      - if: ${{ steps.wheel_phase.outputs.enabled == 'true' }}
        name: Install the frozen Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - if: ${{ steps.wheel_phase.outputs.enabled == 'true' }}
        run: |
          python -m pip install \
            maturin==1.14.1 \
            jsonschema==4.26.0 \
            twine==7.0.0 \
            check-wheel-contents==0.6.3 \
            auditwheel==6.7.0
          python tools/verify_release_identity.py --tag v0.2.7
          python tools/verify_carryover.py --check
          python tools/generate_sibling_aliases.py --check
          maturin build --locked --release --out dist
          # The release registry check reads the native host's compile-time
          # identity from an importable extension, so it runs after the
          # build with the wheel installed, mirroring the publish workflow.
          # numpy comes from the GPU module's import chain.
          python -m pip install --disable-pip-version-check "numpy>=1.24" dist/*.whl
          python tools/generate_registry.py --release-check
          python tools/verify_release_artifacts.py dist
          twine check --strict dist/*.whl
          check-wheel-contents dist/*.whl
          auditwheel show dist/*.whl
          tools/run_packaging_smoke.sh dist/*.whl

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - run: python tools/scan_non_ascii.py
      - run: python tools/scan_name_residue.py
      - run: python tools/scan_secrets.py
      - run: python tools/scan_version_constants.py
