# Publish the one audited core wheel to PyPI via trusted publishing (OIDC).
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Install the frozen Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
      - name: Install frozen release tools
        run: |
          python -m pip install --disable-pip-version-check \
            maturin==1.14.1 \
            jsonschema==4.26.0 \
            twine==7.0.0 \
            check-wheel-contents==0.6.3 \
            auditwheel==6.7.0
      - name: Verify the release identity and generated surfaces
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python tools/verify_release_identity.py \
            --tag "${{ github.event.release.tag_name }}"
          python tools/generate_pypi_readme.py --check
          python tools/update_fast_cpu_registry.py --check
          python tools/verify_carryover.py --check
          python tools/generate_sibling_aliases.py --check
      - name: Build the single core wheel
        run: maturin build --locked --release --out dist
      - name: Run the release registry check against the built wheel
        # The prebuilt-binding check reads the native host's compile-time
        # identity from an importable extension, so it runs after the build
        # with the wheel installed. numpy comes from the GPU module's import
        # chain and is not a core wheel dependency.
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.24" dist/*.whl
          python tools/generate_registry.py --release-check
      - name: Audit the exact artifact set
        run: |
          python tools/verify_release_artifacts.py dist
          twine check --strict dist/*.whl
          check-wheel-contents dist/*.whl
          auditwheel show dist/*.whl
          tools/run_packaging_smoke.sh dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-wheel-${{ github.event.release.tag_name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-wheel-${{ github.event.release.tag_name }}
          path: dist
      - name: Re-verify the downloaded wheel
        run: python tools/verify_release_artifacts.py dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
