[package]
name = "toktier-gigatoken-core"
version.workspace = true
edition = "2024"
license = "MIT"
repository.workspace = true
description = "TokTier's audited, corrected native Gigatoken BPE core."

[features]
# The mechanically retained upstream unit modules depend on Gigatoken's
# unpublished/local corpus fixtures.  TokTier's release gate exercises this
# crate through its own differential and facade suites; maintainers with the
# upstream fixture tree may opt into those modules explicitly.
upstream-tests = ["dep:fancy-regex", "dep:memmap2", "dep:rand"]

[dependencies]
aho-corasick.workspace = true
base64.workspace = true
eyre.workspace = true
fancy-regex = { version = "0.18.0", optional = true }
icu_properties.workspace = true
itertools.workspace = true
memchr.workspace = true
memmap2 = { version = "0.9", features = ["stable_deref_trait"], optional = true }
rand = { version = "0.10", optional = true }
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
sonic-rs.workspace = true
spm_precompiled.workspace = true
unicode-normalization-alignments.workspace = true
winnow.workspace = true

[dev-dependencies]
# The judge, for the character-class parity gate in
# `src/pretokenize/unicode.rs`: the reference engine reaches Oniguruma
# through `tokenizers`, and this crate's classes have to answer about
# every code point the way Oniguruma does. Taken with no default
# features, the way `tokenizers` takes it, so no bindgen enters the
# build.
onig = { version = "6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
# Keep the vendored upstream signature and import shape recognizable
# without silencing the whole `unused` group: dead_code, unused_unsafe,
# and the other members stay at their default level so CI can see them.
unused_variables = "allow"
unused_imports = "allow"
