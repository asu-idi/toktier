[package]
name = "toktier-py"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin Python facade over the toktier session store (pyo3)."

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Binds the core's corruption-injection helper into the extension for
# the behavioral test suites. Never enabled in release wheels: the
# default build carries no test-only capability.
testing = ["toktier-store-core/testing"]

[dependencies]
toktier-routing-core = { path = "../toktier-routing-core", version = "=0.2.1" }
toktier-store-core = { path = "../toktier-store-core", version = "=0.2.1" }
toktier-store-sqlite = { path = "../toktier-store-sqlite", version = "=0.2.1" }
pyo3.workspace = true
serde_json.workspace = true

[build-dependencies]
sha2.workspace = true
