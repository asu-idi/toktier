[package]
name = "toktier"
version.workspace = true
edition.workspace = true
rust-version = "1.93.1"
build = "build.rs"
license.workspace = true
repository.workspace = true
description = "Rust API preview for TokTier's exact, stateful tokenization runtime"
homepage = "https://github.com/asu-idi/toktier"
documentation = "https://docs.rs/toktier"
readme = "README.md"
keywords = ["tokenization", "llm", "bpe", "cuda", "serving"]
categories = ["text-processing"]
publish = ["crates-io"]
include = ["src/**", "data/**", "examples/**", "tests/**", "build.rs", "build_support/**", "LICENSE", "NOTICE", "README.md"]

[lib]
path = "src/lib.rs"

[features]
default = ["sqlite", "prebuilt-gpu", "serving"]
sqlite = ["dep:toktier-store-sqlite"]
prebuilt-gpu = ["dep:toktier-cuda-driver"]
jit = ["prebuilt-gpu"]
network = ["dep:ureq"]
serving = []
serde = []

[dependencies]
flate2.workspace = true
fs2.workspace = true
# The three text-semantics libraries the reference engine's own graph
# already resolves. They are taken here as caret edges rather than exact
# ones on purpose: the certificate compares the version of the tables
# they carry, which `crates/toktier/src/behavior_version.rs` reads from
# the libraries this build links, and pinning the packages exactly would
# be the comparison this release deliberately stopped making. `onig`
# takes no default features, the way `tokenizers` takes it, so no
# bindgen enters the build.
onig = { version = "6", default-features = false }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toktier-routing-core = { path = "../toktier-routing-core", version = "=0.2.6" }
toktier-cuda-driver = { path = "../toktier-cuda-driver", version = "=0.2.6", optional = true }
toktier-store-core = { path = "../toktier-store-core", version = "=0.2.6" }
toktier-store-sqlite = { path = "../toktier-store-sqlite", version = "=0.2.6", optional = true }
unicode-segmentation = "1"
ureq = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "=3.23.0"

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true
