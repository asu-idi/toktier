<text x="70.0" y="420.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">L1 measured capacity-lifted so nothing evicts; by design it keeps the full cumulative id vector at every special-token boundary</text>
