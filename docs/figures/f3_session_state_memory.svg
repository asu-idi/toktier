<text x="70.0" y="444.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">For scale: a long-lived gigatoken engine grew +1.5 GB RSS over ~915 docs (per-process warm cache, not per-session state).</text>
