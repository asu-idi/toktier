# Configure strict static type checking for Python 3.10 and newer.
[mypy]
# The name-reservation placeholder ships its own toktier package.
exclude = (?x)(^packaging/placeholder/|^\.venv/)
# Local runs need --no-site-packages because the installed numpy stubs use
# syntax newer than the configured python_version.
python_version = 3.10
strict = True
warn_unreachable = True
pretty = True
show_error_codes = True
no_incremental = True

# Optional third-party dependencies of the GPU extra. They are not
# installed in the lint environment and they do not ship type
# information we want to depend on, so their public surface is treated
# as untyped rather than blocking the check. Our own annotations are
# still checked strictly.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-tokenizers.*]
ignore_missing_imports = True

# numpy is skipped rather than merely allowed to be missing: its bundled
# stubs use syntax newer than the interpreter baseline configured above,
# so following them fails on a machine where numpy happens to be
# installed.
[mypy-numpy]
ignore_missing_imports = True
follow_imports = skip
ignore_errors = True

[mypy-numpy.*]
ignore_missing_imports = True
follow_imports = skip
ignore_errors = True

# pytest is a test-only dependency and is not installed in the lint
# environment; its decorators are untyped there, which is a property of
# the tooling rather than of the tests.
[mypy-pytest]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_decorators = False

[mypy-conftest]
disallow_untyped_decorators = False

[mypy-tests.*.*]
disallow_untyped_decorators = False


# Test-tier helper modules are imported by path under pytest's importlib
# mode, so they are not importable as top-level modules during linting.
[mypy-_support]
ignore_missing_imports = True

[mypy-jsonschema]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True
