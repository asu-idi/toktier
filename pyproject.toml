# Distribution metadata for the toktier Python package (maturin mixed layout).
#
# Layout: Python sources live under `src/toktier`, the compiled part is the
# private native module built from `crates/toktier-py`. The base package is
# the complete certified CPU product. It still imports without loading the
# oracle, Transformers, a GPU runtime, CUDA, or the network; GPU execution is
# additive through an explicit extra.

[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "toktier"
description = "Correctness-first tokenization with a certified fast path."
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES",
    "packaging/fast_cpu/LICENSE-gigatoken",
    "packaging/fast_cpu/NOTICE-gigatoken-pinned",
    "packaging/fast_cpu/THIRD_PARTY_LICENSES-gigatoken.txt",
]
# Package version axis (versioning.md axis 1). Taken from the Cargo package
# so that the wheel, the sdist and the crate cannot drift apart.
dynamic = ["version"]
authors = [
    { name = "Zhenyu Zhang" },
    { name = "Zhichao Cao" },
]
keywords = [
    "tokenization",
    "byte-pair-encoding",
    "wordpiece",
    "gpu",
    "cuda",
    "llm-serving",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    # Exact reference oracle used by the shipped CPU and GPU certificates.
    "tokenizers==0.22.2",
    # Loader used to materialize the live tokenizer object consumed by the
    # vendored corrected-Gigatoken engine. The base install is deliberately
    # complete; users do not need a second "fast" installation step.
    "transformers==4.57.6",
    # Artifact retrieval from the upstream hub.
    "huggingface-hub>=0.30",
    # Platform-conventional cache and state directories (config.md section 5).
    "platformdirs>=3.0",
    # Compatibility TOML parser for Python 3.10; 3.11+ provides tomllib.
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# Explicit experimental alternative.  It is never selected by the certified
# policy and carries no TokTier exact-ID guarantee.
fastokens = [
    "fastokens==0.3.1",
]
# Prebuilt delivery mode for the GPU backend: the shipped fatbin is loaded
# through the CUDA driver API (bound via the standard library's ctypes over
# the user's own libcuda), so no nvcc, ninja or first-load compile is needed.
# The driver floor is the r580 generation (CUDA 13); older drivers fall back
# to the JIT delivery with the reason stated.
gpu = [
    "torch~=2.11",
    # Table export produces contiguous device-upload buffers.
    "numpy>=1.24",
]
# JIT delivery is a strict superset of the complete CPU profile, like
# ``gpu``. Ninja is intentionally absent from ``gpu`` and present here:
# Python packaging does not persist which extra was requested, so its
# presence is the automatic facade profile marker for local JIT delivery
# (an explicit ``gpu_delivery=`` argument remains authoritative).
gpu-jit = [
    "torch~=2.11",
    "ninja~=1.11",
    # Table export produces contiguous device-upload buffers.
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/asu-idi/toktier"
Repository = "https://github.com/asu-idi/toktier"

[dependency-groups]
# Development groups, aligned with the checks CI runs (ruff.toml, mypy.ini).
# jsonschema serves the registry/evidence verifiers (tools/*.py --check)
# and the schema-validation tests; it is not a runtime dependency.
test = ["pytest==9.1.1", "jsonschema==4.26.0"]
lint = ["ruff==0.16.1", "mypy==2.3.0"]

[tool.maturin]
# The native module is delivered by the store lane's binding crate.
manifest-path = "crates/toktier-py/Cargo.toml"
python-source = "src"
# Private, typed native module (ARCHITECTURE.md section 4). The binding
# crate's `[lib] name` has to match the last component of this path, so the
# crate must expose `_native`.
module-name = "toktier._native"
features = ["pyo3/extension-module"]
[tool.maturin.sbom]
# Expose the integrated corrected-Gigatoken dependency SBOM in the standard
# dist-info/sboms location. The engine itself is linked into toktier._native;
# the wheel must not carry a second native extension or top-level package.
include = ["packaging/fast_cpu/gigatoken.cyclonedx.json"]

[project.scripts]
toktier = 'toktier.cli:main'
