# Pytest configuration -- the single test-runner settings source.
#
# This lives in pytest.ini rather than pyproject.toml on purpose:
# pyproject.toml is hashed into the fast_cpu and native_host source
# identities, so a test-runner settings change there would invalidate
# certification identities without any product change.
[pytest]
minversion = 7.0
testpaths = tests
# Tests run against the source tree; an editable or wheel install is
# exercised separately by the packaging smoke suite.
pythonpath = src
# importlib mode allows equal basenames across test tiers
# (tests/test_config.py vs tests/conformance/test_config.py).
addopts = -ra --import-mode=importlib
markers =
    slow: structurally heavy case (multi-megabyte input or a whole parity corpus); deselect with -m "not slow" for a quick pass
